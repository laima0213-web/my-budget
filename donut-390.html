<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>우리집 가계부 390x844 확인</title>
<style>html,body{margin:0;background:#dcd8d0;display:flex;align-items:flex-start;justify-content:center;min-height:100vh}
html{scrollbar-width:none}html::-webkit-scrollbar{display:none}
iframe{width:390px;height:844px;border:0;background:#FBF8F1;box-shadow:0 2px 14px rgba(0,0,0,.18)}
</style>
</head><body><iframe id="phone" src="./index.html?v=9" title="우리집 가계부 390x844"></iframe>
<script>
/* 확인용 틀에서만: 폰과 같게 안쪽 스크롤바를 숨깁니다 (앱 코드는 그대로) */
document.getElementById('phone').addEventListener('load', function () {
  try {
    var d = this.contentDocument, s = d.createElement('style');
    s.textContent = 'html{scrollbar-width:none}html::-webkit-scrollbar{display:none}';
    d.head.appendChild(s);
  } catch (e) {}
});
</script>
</body></html>
